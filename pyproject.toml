[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sis-hw1"
version = "0.1.0"
description = "B9339 HW1 SPY intraday momentum replication"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "pytest>=7.4",
  "markdown>=3.5",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
