[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sis-hw2"
version = "0.1.0"
description = "B9339 HW2 Value-Quality-Momentum investor pitch research"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "yfinance>=0.2.40",
  "pandas-datareader>=0.10",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "requests>=2.31",
  "lxml>=4.9",
  "tqdm>=4.66",
  "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
where = ["src"]
